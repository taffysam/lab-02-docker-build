name: Deploy to production

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Promoted GHCR image reference"
        required: true
        type: string
      simulate_failure:
        description: "Simulate production deployment failure to test rollback"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: shipping-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: [self-hosted, Windows, X64]
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Docker access
        shell: powershell
        run: |
          docker info
          if ($LASTEXITCODE -ne 0) {
            throw "Docker Desktop is not accessible."
          }

      - name: Create production environment configuration
        shell: powershell
        env:
          APP_ENV: ${{ vars.APP_ENV }}
          APP_NAME: ${{ vars.APP_NAME }}
        run: |
          @"
          APP_ENV=$env:APP_ENV
          APP_NAME=$env:APP_NAME
          "@ | Set-Content .env.prod

      - name: Deploy and verify application
        shell: powershell
        env:
          DEPLOY_IMAGE: ${{ inputs.image }}
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
        run: |
          if ($env:SIMULATE_FAILURE -eq "true") {
              Write-Host "Production failure simulation enabled."

              ./scripts/deploy.ps1 `
                -Image $env:DEPLOY_IMAGE `
                -Environment production `
                -SimulateFailure
          }
          else {
              ./scripts/deploy.ps1 `
                -Image $env:DEPLOY_IMAGE `
                -Environment production
          }

          if ($LASTEXITCODE -ne 0) {
              throw "Production deployment failed. Check deployment and rollback logs."
          }