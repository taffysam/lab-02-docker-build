
name: Shipping Calculator Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -v

  build:
    name: Build and validate image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t shipping-calculator:${{ github.sha }} .

      - name: Run container tests
        run: docker run --rm shipping-calculator:${{ github.sha }} python -m pytest -v

      
      - name: Save validated Docker image
        run: |
          docker save shipping-calculator:${{ github.sha }} -o shipping-calculator.tar

      - name: Upload validated image
        uses: actions/upload-artifact@v4
        with:
          name: shipping-calculator-image
          path: shipping-calculator.tar
          retention-days: 1

  
  publish:
    name: Publish Docker image
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download validated image
        uses: actions/download-artifact@v4
        with:
          name: shipping-calculator-image

      - name: Load validated Docker image
        run: docker load -i shipping-calculator.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and publish validated image
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/shipping-calculator

          docker tag shipping-calculator:${{ github.sha }} $IMAGE:${{ github.sha }}

          docker push $IMAGE:${{ github.sha }}