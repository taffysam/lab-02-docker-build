name: Shipping Calculator Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -v

  build:
    name: Build and validate image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t shipping-calculator:${{ github.sha }} .

      - name: Run container tests
        run: docker run --rm shipping-calculator:${{ github.sha }} python -m pytest -v

      - name: Save validated Docker image
        run: |
          docker save shipping-calculator:${{ github.sha }} -o shipping-calculator.tar

      - name: Upload validated image
        uses: actions/upload-artifact@v4
        with:
          name: shipping-calculator-image
          path: shipping-calculator.tar
          retention-days: 1

  publish:
    name: Publish Docker image
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image-ref.outputs.image }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download validated image
        uses: actions/download-artifact@v4
        with:
          name: shipping-calculator-image

      - name: Load validated Docker image
        run: docker load -i shipping-calculator.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and publish validated image
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/shipping-calculator
          TAG=${{ github.sha }}

          docker tag shipping-calculator:${{ github.sha }} $IMAGE:$TAG
          docker push $IMAGE:$TAG

      - name: Capture immutable image reference
        id: image-ref
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/shipping-calculator
          TAG=${{ github.sha }}

          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE:$TAG)

          echo "Published immutable image: $DIGEST"
          echo "image=$DIGEST" >> "$GITHUB_OUTPUT"

  deploy-development:
    name: Deploy published image to development
    needs: publish
    runs-on: [self-hosted, Windows, X64]
    environment: development

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify Docker access
        shell: powershell
        run: |
          docker info

          if ($LASTEXITCODE -ne 0) {
            throw "Docker Desktop is not accessible."
          }

      - name: Create development environment configuration
        shell: powershell
        env:
          APP_ENV: ${{ vars.APP_ENV }}
          APP_NAME: ${{ vars.APP_NAME }}
        run: |
          @"
          APP_ENV=$env:APP_ENV
          APP_NAME=$env:APP_NAME
          "@ | Set-Content .env.dev

      - name: Deploy published image
        shell: powershell
        env:
          DEPLOY_IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          Write-Host "Promoting immutable image to development:"
          Write-Host $env:DEPLOY_IMAGE

          ./scripts/deploy.ps1 `
            -Image $env:DEPLOY_IMAGE `
            -Environment development

          if ($LASTEXITCODE -ne 0) {
            throw "Development deployment failed."
          }

  deploy-production:
    name: Deploy published image to production
    needs:
      - publish
      - deploy-development
    runs-on: [self-hosted, Windows, X64]
    environment: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify Docker access
        shell: powershell
        run: |
          docker info

          if ($LASTEXITCODE -ne 0) {
            throw "Docker Desktop is not accessible."
          }

      - name: Create production environment configuration
        shell: powershell
        env:
          APP_ENV: ${{ vars.APP_ENV }}
          APP_NAME: ${{ vars.APP_NAME }}
        run: |
          @"
          APP_ENV=$env:APP_ENV
          APP_NAME=$env:APP_NAME
          "@ | Set-Content .env.prod

      - name: Deploy same published image to production
        shell: powershell
        env:
          DEPLOY_IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          Write-Host "Promoting immutable image to production:"
          Write-Host $env:DEPLOY_IMAGE

          ./scripts/deploy.ps1 `
            -Image $env:DEPLOY_IMAGE `
            -Environment production

          if ($LASTEXITCODE -ne 0) {
            throw "Production deployment failed."
          }